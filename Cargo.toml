[package]
name = "hidmaestro-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Windows client for one HIDMaestro Xbox 360 controller"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Registry",
    "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties",
    "Win32_System_LibraryLoader", "Win32_UI_Input_XboxController",
    "Win32_System_Pipes", "Win32_Storage_FileSystem",
    "Win32_Devices_Enumeration_Pnp",
] }
